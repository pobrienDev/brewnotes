[project]
name = "brewnotes-backend"
version = "0.1.0"
description = "BrewNotes API: recipe design, brewing log, tasting notes and discovery"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.12",
    "authlib>=1.8.0",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.5",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit
    "N",         # naming
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async misuse
    "T20",       # no print in app code
]
ignore = [
    "B008",      # FastAPI uses function calls (Depends) in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "T20"]
"app/cli.py" = ["T20"]
"alembic/**" = ["RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic/env.py"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alembic.versions.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error", "ignore::DeprecationWarning:hypothesis"]
