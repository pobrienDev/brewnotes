services:
  postgres:
    image: postgres:18
    container_name: brewnotes-postgres
    environment:
      POSTGRES_USER: brewnotes
      POSTGRES_PASSWORD: brewnotes
      POSTGRES_DB: brewnotes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewnotes -d brewnotes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
