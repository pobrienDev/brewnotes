name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, types, tests, migrations, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: brewnotes
          POSTGRES_PASSWORD: brewnotes
          POSTGRES_DB: brewnotes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brewnotes -d brewnotes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://brewnotes:brewnotes@localhost:5432/brewnotes_test
      TEST_DATABASE_URL: postgresql+psycopg://brewnotes:brewnotes@localhost:5432/brewnotes_test
      SECRET_KEY: ci-only-value-not-a-secret-0123456789abcdef
      PUBLIC_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: pip-audit
        run: |
          uv export --locked --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit --disable-pip --require-hashes -r /tmp/requirements.txt

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high

  contract:
    name: OpenAPI contract is committed and current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - name: Regenerate the spec and the typed client
        run: |
          cd backend && uv run python -m app.cli export-openapi --out ../frontend/openapi.json
          cd ../frontend && npm run generate-api
      - name: Fail if the committed files are stale
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts

  image:
    name: Docker image serves frontend, deep links and health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f backend/Dockerfile -t brewnotes:ci .
      - name: Smoke test in production mode
        run: |
          trap 'echo "--- container logs ---"; docker logs brewnotes; docker rm -f brewnotes' EXIT
          docker run -d --name brewnotes -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg://nobody:nothing@127.0.0.1:1/none \
            -e SECRET_KEY=ci-only-value-not-a-secret-0123456789abcdef \
            -e PUBLIC_BASE_URL=https://brewnotes.example \
            -e ALLOWED_HOSTS=localhost \
            -e GITHUB_CLIENT_ID=x -e GITHUB_CLIENT_SECRET=x \
            -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=x \
            brewnotes:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/v1/health/live && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/recipes/0192f3a0-1234-7abc-8def-0123456789ab | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/health/ready)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/v1/nope)" = "404"
          docker exec brewnotes id -u | grep -qv '^0$'
